name: tesclinic
description: TesClinic - Plataforma adaptativa de performance e formulação inteligente com dados reais de saúde.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.2
  health: 13.2.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
